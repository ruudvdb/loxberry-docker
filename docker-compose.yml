services:
  loxberry:
    # Built and installed by build-installed-image.sh (Komodo pre_deploy)
    # before this file is deployed - see README.md. It only exists
    # locally, so never pull it. Set LOXBERRY_IMAGE_TAG to an older date
    # tag to roll back.
    image: loxberry-docker:${LOXBERRY_IMAGE_TAG:-installed}
    pull_policy: never
    container_name: loxberry
    hostname: loxberry
    privileged: true          # required because systemd runs as PID 1
    tty: true                 # required for ForwardToConsole (journald ->
                               # /dev/console) to actually reach `docker logs`
    cgroup: host
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /home/docker/loxberry-data:/opt/loxberry
      # Automatic backups of /opt/loxberry, taken before every reinstall
      # (the LoxBerry installer wipes /opt/loxberry). See README.md.
      - /home/docker/loxberry-backup:/var/backups/loxberry
    ports:
      # "<host port>:<container port>" - only the left-hand number needs to
      # change if it clashes with something else you already run. Defaults
      # and full explanation of every port are in .env.example / README.md.
      - "${LOXBERRY_HTTP_PORT:-8880}:80"
      - "${LOXBERRY_HTTPS_PORT:-8843}:443"
      - "${LOXBERRY_SSH_PORT:-2222}:22"
      - "${LOXBERRY_FTP_PORT:-2121}:21"
      - "${LOXBERRY_MQTT_PORT:-18830}:1883"
      # MQTT Gateway UDP input: the Miniserver sends "Virtual Output UDP"
      # commands here, which LoxBerry relays to MQTT.
      - "${LOXBERRY_MQTT_UDP_PORT:-11884}:11884/udp"
      # Weather4Lox cloud emulator: DNS (dnsmasq redirects
      # weather.loxone.com to LoxBerry) and the emulated weather server.
      # The Miniserver only ever uses ports 53 and 6066, so the host side
      # must stay 53/6066 too.
      - "53:53/udp"
      - "53:53/tcp"
      - "6066:6066"
      # Samba (NetBIOS + SMB) is off by default: it needs several ports and
      # is rarely reachable meaningfully through remapped host ports anyway.
      # Uncomment if you actually want file sharing from outside the host:
      # - "${LOXBERRY_SAMBA_UDP_137:-1137}:137/udp"
      # - "${LOXBERRY_SAMBA_UDP_138:-1138}:138/udp"
      # - "${LOXBERRY_SAMBA_TCP_139:-1139}:139"
      # - "${LOXBERRY_SAMBA_TCP_445:-1445}:445"
    environment:
      # LAN IP of the Docker host. LoxBerry otherwise reports its
      # unreachable container IP (172.x) to plugins - see README.md.
      - LOXBERRY_HOST_IP=${LOXBERRY_HOST_IP:-}
    restart: unless-stopped
